name: Deploy to TestPyPI 📦

# trigger deploy workflow once build and test workflow has successfully completed
on:
  workflow_run:
    workflows: ["Building and Testing"]
    # Only react to runs on main. Without a branch filter, a successful run
    # triggered by any fork's pull request also fired this token-bearing job.
    branches: [ main ]
    types: [completed]

  # allow for workflow to be manually initiated from the Actions tab
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repo to build it. The
# PyPI upload authenticates with its own token, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# build and deploy to Test PyPI server if test workflow was successful or manual trigger was selected
jobs:
  test_success:
    name: Deploy to TestPyPI 📦
    runs-on: ubuntu-latest         # platform: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 15
    # The branch filter above still matches a fork PR whose head branch is named
    # "main", so also require that the triggering run was not a pull_request.
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    strategy:
      matrix:
        python-version: ["3.10"]  #deploying using one Python version on 1 runner
    steps:
    - uses: actions/checkout@v7

    # build distribution package using poetry tool and upload to the test PYPi server via custom github action
    - name: Build and publish to Test PyPI
      uses: JRubics/poetry-publish@v2.1
      with:
        pypi_token: ${{ secrets.PYPI_TEST }}
        repository_name: "testpypi"
        repository_url: "https://test.pypi.org/legacy/"

    #sleep for 30 seconds to ensure that distribution package has finished uploading to Test PyPI
    # Plain `sleep` rather than a third-party action: jakejarvis/wait-action@master
    # was a mutable ref on someone else's repo running in a job that holds the
    # PyPI token, which is an avoidable supply-chain risk for a 30-second pause.
    - name: Wait / Sleep
      run: sleep 30s

    # download package of repo_people from Test PYPI server to ensure it uploaded correctly
    - name: Install repo-people from Test PyPI
      run: |
        pip install -i https://test.pypi.org/simple/ repo-people --upgrade
        echo "repo-people successfully installed"

  # test workflow was not successful so package not deployed to Test PyPI or PyPI
  test_failure:
    name: Test workflow failure
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - run: echo "Test workflow failure, package not deployed to Test PyPI server"